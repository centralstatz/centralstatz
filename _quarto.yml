project:
  type: website
  render:
    - "*.qmd"
    - "projects/**/*.qmd"
    - "case-studies/**/*.qmd"

website:
  title: "CentralStatz Lab"
  favicon: "logo_background.png"
  google-analytics: "G-GQTNSLKV9S"
  site-url: https://www.centralstatz.com/
  repo-url: https://github.com/centralstatz/centralstatz
  description: "CentralStatz Lab is an independent analytical systems lab exploring how rigorous statistical thinking, reproducible design, and AI-assisted development can produce better ways to work with data."
  open-graph: true
  twitter-card: true
  search: false
  page-footer:
    left: "© 2026 CentralStatz Statistical & Data Sciences LLC"
    right: |
      <div class="footer-icons">
        <a href="mailto:alex@centralstatz.com" aria-label="Email CentralStatz"><i class="bi bi-envelope"></i></a>
        <a href="https://www.linkedin.com/company/centralstatz" aria-label="CentralStatz on LinkedIn"><i class="bi bi-linkedin"></i></a>
        <a href="https://github.com/centralstatz" aria-label="CentralStatz on GitHub"><i class="bi bi-github"></i></a>
        <a href="https://www.youtube.com/@centralstatz" aria-label="CentralStatz on YouTube"><i class="bi bi-youtube"></i></a>
      </div>
  navbar:
    logo: "logo.png"
    title: false
    pinned: true
    left:
      - text: Lab
        href: "/#active-projects"
      - text: Method
        href: "/#how-the-lab-works"
      - text: Philosophy
        href: "/#philosophy"
      - text: Work With CentralStatz
        href: "/#work-with-centralstatz"
      - text: About
        href: "/#about"
    right:
      - text: Contact
        href: "/#contact"

format:
  html:
    theme: [styles.scss, lux]
    anchor-sections: true
    smooth-scroll: true

editor: source
